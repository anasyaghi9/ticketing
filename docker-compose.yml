services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_started

  locust:
    image: locustio/locust
    profiles: ["load"]
    volumes:
      - ./loadtest:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://web:8000 --headless -u 100 -r 20 -t 30s
    depends_on:
      - web

volumes:
  pgdata: